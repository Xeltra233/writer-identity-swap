<div class="wis-panel">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>编写者身份替换</b>
            <span id="wis_status" class="wis-badge wis-badge-idle">待识别</span>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label wis-toggle">
                <input type="checkbox" id="wis_enabled">
                <span>启用</span>
            </label>

            <div class="wis-row">
                <span class="wis-label">预设</span>
                <span id="wis_preset_name" class="wis-value"></span>
                <span id="wis_origin" class="wis-muted"></span>
                <div id="wis_detect" class="menu_button menu_button_icon wis-icon-button" title="重新识别">
                    <i class="fa-solid fa-arrows-rotate"></i>
                </div>
            </div>

            <div class="wis-block">
                <div class="wis-label">识别到的编写者</div>
                <div id="wis_candidates" class="wis-chips"></div>
            </div>

            <div class="wis-grid">
                <label class="wis-field">
                    <span>原身份</span>
                    <input id="wis_source" class="text_pole" type="text" placeholder="小猫之神">
                </label>
                <label class="wis-field">
                    <span>改成</span>
                    <input id="wis_target" class="text_pole" type="text" placeholder="赤狐">
                </label>
            </div>

            <div class="wis-block">
                <div class="wis-label">别名</div>
                <div id="wis_aliases" class="wis-chips"></div>
                <input id="wis_alias_input" class="text_pole wis-alias-input" type="text" placeholder="额外别名，逗号分隔">
            </div>

            <div id="wis_issues" class="wis-issues"></div>

            <div class="wis-row wis-options">
                <label class="checkbox_label"><input type="checkbox" id="wis_auto_detect"><span>自动识别</span></label>
                <label class="checkbox_label"><input type="checkbox" id="wis_include_aliases"><span>用别名</span></label>
                <label class="checkbox_label"><input type="checkbox" id="wis_replace_history"><span>含历史</span></label>
                <label class="checkbox_label"><input type="checkbox" id="wis_case_insensitive"><span>忽略大小写</span></label>
                <label class="checkbox_label"><input type="checkbox" id="wis_show_toasts"><span>提示</span></label>
                <label class="checkbox_label"><input type="checkbox" id="wis_sync_target"><span>同步目标</span></label>
                <div id="wis_preview" class="menu_button">预览命中</div>
            </div>

            <div id="wis_stats" class="wis-muted"></div>
            <div id="wis_last" class="wis-muted"></div>
            <div id="wis_preview_out" class="wis-samples"></div>

            <details class="wis-details">
                <summary>上次发送的样本</summary>
                <div id="wis_samples" class="wis-samples"></div>
            </details>
        </div>
    </div>
</div>
